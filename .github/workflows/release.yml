name: Release

# Pushing the tag vX.Y.Z (X.Y.Z being the version of app/Cargo.toml) builds the two programs,
# writes the release notes from the commits since the previous tag and publishes the release.
# Started by hand ("Run workflow"), it does the same without publishing: the package and the
# notes of what is not released yet are left on the run's page.
# See "Releases" in CONTRIBUTING.md.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    outputs:
      version: ${{ steps.version.outputs.version }}
      package: ${{ steps.package.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: |
          $line = Get-Content app\Cargo.toml | Where-Object { $_ -match '^version\s*=\s*"([^"]+)"' } | Select-Object -First 1
          if (-not $line) { throw 'no version in app/Cargo.toml' }
          [void]($line -match '"([^"]+)"')
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              if ($env:GITHUB_REF_NAME -ne "v$version") {
                  throw ("tag {0} but app/Cargo.toml says {1}: the tag must be v{1}" -f $env:GITHUB_REF_NAME, $version)
              }
          } else {
              $version = '{0}-dev.{1}' -f $version, $env:GITHUB_SHA.Substring(0, 7)
          }
          Write-Host "version $version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version" -Encoding ascii

      - name: Repository checks
        run: |
          .\scripts\setup-tools.ps1 -Only de4dot-cex
          .\scripts\dev\check-repo.ps1 -RequireLib

      - name: Rust toolchain (app/rust-toolchain.toml)
        working-directory: app
        run: |
          rustup toolchain install
          cargo --version

      # No cache: a release is built from nothing.
      - name: Tests
        working-directory: app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\work\app
        run: cargo test --locked

      - name: Build (scripts/build-app.ps1)
        run: .\scripts\build-app.ps1

      - name: The console starts
        run: |
          & .\work\app\release\ochu-cli.exe help
          if ($LASTEXITCODE -ne 0) { throw 'ochu-cli.exe help failed' }

      - name: Package
        id: package
        run: |
          $name = 'ochu-{0}-windows-x64' -f '${{ steps.version.outputs.version }}'
          $stage = Join-Path 'work\dist' $name
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item work\app\release\ochu.exe, work\app\release\ochu-cli.exe, LICENSE, LEGAL.md, THIRD-PARTY-NOTICES.md $stage
          Compress-Archive -Path $stage -DestinationPath "work\dist\$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "work\dist\$name.zip").Hash.ToLowerInvariant()
          # LF, no BOM: 'sha256sum -c' reads it.
          [IO.File]::WriteAllText((Join-Path (Resolve-Path 'work\dist') 'SHA256SUMS.txt'), ("{0} *{1}.zip`n" -f $hash, $name))
          Write-Host "$hash  $name.zip"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "package=$name.zip" -Encoding ascii

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            work/dist/*.zip
            work/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  notes:
    name: Release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit and tag: the notes are read from the history

      - name: Changes since the previous tag
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/cliff.toml
          args: ${{ github.ref_type == 'tag' && '--latest' || '--unreleased' }}
        env:
          OUTPUT: notes.md

      # A release with another src.sha256 generates another source: say so.
      - name: Footer
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$REF_NAME^" 2>/dev/null || true)
          else
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          fi
          {
            echo
            echo '---'
            echo
            if [ -z "$previous" ]; then
              echo 'First release. The source it generates is the one of `src.sha256`.'
            elif git diff --quiet "$previous" HEAD -- src.sha256; then
              echo "\`src.sha256\` is the one of $previous: this release generates the same source."
            else
              echo "\`src.sha256\` changed since $previous: this release generates another source. Run it again to get it."
            fi
            echo
            echo 'Needs your own copy of the reference build (`game.sha256`). The archive holds no game binary and no source code of the game; see `LEGAL.md`.'
            echo
            echo "Check the download with \`SHA256SUMS.txt\`, or with \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`."
          } >> notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [build, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment only takes tags v*, and waits for the maintainer when it has a
    # required reviewer: a tag pushed by mistake publishes nothing by itself.
    environment: Release
    permissions:
      contents: write # the release
      id-token: write # the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: in

      - name: Attest the archive (built by this run, from this commit)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: in/package/*.zip

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ochu!! ${TAG#v}" --notes-file in/notes/notes.md "${flags[@]}" \
            in/package/*.zip in/package/SHA256SUMS.txt
